name: collectionner
description: "Collectionner mobile app for Android and iOS."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.7

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  cached_network_image: ^4.0.5
  dio: ^5.11.1
  flutter_riverpod: ^3.4.3
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^18.1.1
  image: ^4.12.0
  image_cropper: ^13.0.0
  image_picker: ^1.2.4
  intl: ^0.20.3
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8
  mocktail: ^1.0.5

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/branding/
    - assets/images/collectibles/cards/
    - assets/images/collectibles/figures/
    - assets/images/collectibles/games/
    - assets/images/collectibles/records/
    - assets/images/collectibles/watches/
    - assets/images/lab/
    - assets/images/placeholders/

# Icon and splash use the official mark the web ships as logo and favicon
# (public/assets/icons/site-icon-512.png). Padded copies live in tool/branding
# so adaptive-icon and Android 12 masks do not crop the artwork.
flutter_launcher_icons:
  android: true
  ios: true
  image_path: tool/branding/site-icon-512.png
  remove_alpha_ios: true
  background_color_ios: "#E9ECE4"
  adaptive_icon_background: "#E9ECE4"
  adaptive_icon_foreground: tool/branding/adaptive-foreground.png
  adaptive_icon_monochrome: tool/branding/adaptive-foreground.png
  min_sdk_android: 24

flutter_native_splash:
  color: "#E9ECE4"
  image: tool/branding/splash-logo.png
  color_dark: "#101714"
  image_dark: tool/branding/splash-logo.png
  android_12:
    color: "#E9ECE4"
    image: tool/branding/splash-icon-android12.png
    color_dark: "#101714"
    image_dark: tool/branding/splash-icon-android12.png
  ios: true
  android: true
  web: false
